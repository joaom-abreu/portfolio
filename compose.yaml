services:
  web:
    build:
      context: .
      target: web
      args:
        VITE_EMAILJS_SERVICE_ID: ${VITE_EMAILJS_SERVICE_ID}
        VITE_EMAILJS_TEMPLATE_ID_FOR_ME: ${VITE_EMAILJS_TEMPLATE_ID_FOR_ME}
        VITE_EMAILJS_TEMPLATE_ID_FOR_SENDER: ${VITE_EMAILJS_TEMPLATE_ID_FOR_SENDER}
        VITE_EMAILJS_PUBLIC_KEY: ${VITE_EMAILJS_PUBLIC_KEY}
    ports:
      - "8080:80"
